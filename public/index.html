<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <title> 💬Chat App</title>
</head>
<body>
    <h1> 💬iChat </h1>
    <div class="main">
        <div class="name">
            <span><i class ="far fa-user"></i></span>
            <input type="'text" id="name-input" class="name-input" value="anonymous" maxlength="20"/>
        </div>
        <ul class="message-container" class="message-container">
            <li class="message-left">
                <p class="message">
                    lorem ipsum
                    <span> bluebird💠 13 August 10:40am</span>
                </p>
            </li>
            <li class="message-right">
                <p class="message">
                    lorem ipsum
                    <span> bluebird💠 13 August 10:40am</span>
                </p>
            </li>
            <li class="message-feedback">
                <p class="feedback" id="feedback">
                    typing...
                </p>
            </li>
        </ul>
        <form class="message-form" id="message-form">
            <input type="text" name="message" id="message-input" class="message-input">
            <div class="v-divider"</div>
            <button type="submit" class="send-button">
                Send<span><i class="fas fa-paper-plane"></i></span>
            </button>
        </form>
        <h3 class="clients-total" id="clients-total">Total clients :2</h3>
    </div>
</body>
</html>

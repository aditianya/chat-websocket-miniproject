<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel ="stylesheet" href="./style.css">
    <title> Chat App</title>
</head>
<body>
    <h1 class="title"> 💬iChat </h1>
    <div class="main">
        <div class="name">
            <span><i class ="far fa-user"></i></span>
            <input type="'text" id="name-input" class="name-input" value="anonymous" maxlength="20"/>
        </div>
        <ul class="message-container">
            <li class="message-left">
                <p class="message">
                    lorem ipsum
                    <span> bluebird💠 13 August 10:40am</span>
                </p>
            </li>
            <li class="message-right">
                <p class="message">
                    lorem ipsum
                    <span> bluebird💠 13 August 10:40am</span>
                </p>
            </li>
            <li class="message-feedback">
                <p class="feedback" id="feedback">
                    typing...
                </p>
            </li>
        </ul>
        <form class="message-form" id="message-form">
            <input type="text" name="message" id="message-input" class="message-input">
            <div class="v-divider"> </div>
            <button type="submit" class="send-button">
                Send  <span><i class="fas fa-paper-plane"></i></span>
            </button>
        </form>
    </div>
     <h3 class="clients-total" id="clients-total">Total clients :2</h3>
     <script src="/socket.io/socket.io.js"></script>
     <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.28.0/moment.min.js"
      integrity="sha512-Q1f3TS3vSt1jQ8AwP2OuenztnLU6LwxgyyYOG1jgMW/cbEMHps/3wjvnl1P3WTrF3chJUWEoxDUEjMxDV8pujg=="
      crossorigin="anonymous"
     ></script>
     <script src="main.js"></script>
</body>
</html>
